name: Beta release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/build_installer.py --check
      - run: python -m unittest discover -s tests -v
      - name: Publish beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=v0.1.5-beta
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; not replacing it."
            exit 0
          fi
          gh release create "$tag" blebox_wiked_install_0.1.5.py \
            --target "$GITHUB_SHA" --prerelease \
            --title "WIKĘD Smart 2.0 — v0.1.5 beta" \
            --notes-file .github/release-notes/0.1.5.md
